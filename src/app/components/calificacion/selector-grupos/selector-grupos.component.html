<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [accion]="'ConsultarTodos'"
    [regresar]="'/menu'"
    [iconoTitulo]="'/assets/images/reporte.png'"
  ></app-header>

  <div class="container-fluid mt-3">
    <div class="row">
      <div class="col-sm-12 col-md-3 px-3 mb-5" *ngFor="let grupo of grupos">
        <div
          class="text-center ficha ficha-grupo"
          [style.background-image]="'linear-gradient(to bottom, #ffffff 80%, ' + grupo.color + ')'"
          (click)="seleccionarGrupo(grupo)"
        >
          <div class="imagen-container">
            <img [src]="grupo.icono" [alt]="grupo.nombre" loading="lazy" decoding="async" />
          </div>
          <p class="nombre-item">{{ grupo.nombre }}</p>
        </div>
      </div>
    </div>

    <!-- Cursos extracurriculares: van aparte porque no son grupos del jardín -->
    <div *ngIf="cursosExtra.length > 0">
      <div class="separador-seccion">
        <span>Cursos extracurriculares</span>
      </div>

      <div class="row">
        <div class="col-sm-12 col-md-3 px-3 mb-5" *ngFor="let curso of cursosExtra">
          <div
            class="text-center ficha ficha-grupo"
            [style.background-image]="'linear-gradient(to bottom, #ffffff 80%, ' + (curso.color || '#3498db') + ')'"
            (click)="seleccionarCursoExtra(curso)"
          >
            <div class="imagen-container">
              <img *ngIf="curso.icono" [src]="curso.icono" [alt]="curso.nombre" loading="lazy" decoding="async" />
              <i *ngIf="!curso.icono" class="fas fa-star sin-icono-ficha"></i>
            </div>
            <p class="nombre-item">
              {{ curso.nombre }}
              <span class="sub-nombre" *ngIf="curso.nombre_area_academica">{{ curso.nombre_area_academica }}</span>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
