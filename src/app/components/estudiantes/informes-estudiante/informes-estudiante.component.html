<div class="modulo">
  <app-header-anidado
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [accion]="'ConsultarTodos'"
    [raiz]="'/estudiantes/informes'"
    [regresar]="'/estudiantes/opciones/' + idEstudiante"
    [iconoTitulo]="'/assets/images/informes-estudiante.png'"
  ></app-header-anidado>

  <!-- El componente se instancia solo cuando ya hay id, porque carga en su ngOnInit -->
  <div class="contenido-informes" *ngIf="idEstudiante && idEstudiante !== '0'">
    <app-estudiante-evaluaciones [idEstudiante]="idEstudiante"></app-estudiante-evaluaciones>
  </div>
</div>
