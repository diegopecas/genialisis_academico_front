<div class="modulo">
    <app-header [tituloModulo]="titulo" [mostrarCrear]="false" [raiz]="'/'" [regresar]="'/menu'" [iconoTitulo]="'/assets/images/estudiantes.png'"></app-header>

    <div class="container-fluid mt-5">

        <!-- Tarjetas de opciones -->
        <div class="row justify-content-center">

            <!-- Estudiantes -->
            <div class="col-lg-3 col-md-6 mb-4" *ngIf="tieneAlguno(['estudiantes.administrar', 'estudiantes.listado'])">
                <div class="card-maestro menu-principal" [class.active]="menuActivo === 'estudiantes'" (click)="toggleMenu('estudiantes', $event)">
                    <div class="card-maestro-content">
                        <div class="icono-container estudiantes">
                            <img src="assets/images/estudiantes.png" alt="Estudiantes" />
                        </div>
                        <h3 class="card-titulo">Estudiantes</h3>
                        <p class="card-descripcion">Administra los estudiantes, sus grupos, grados, horarios y datos académicos</p>
                        <div class="card-footer-custom">
                            <span class="link-accion">Ver opciones <i class="fas fa-chevron-down"></i></span>
                        </div>
                    </div>

                    <div class="submenu-container">
                        <div class="row g-2">
                            <div class="col-6" *ngIf="permisosService.tienePermiso('estudiantes.listado')">
                                <div class="submenu-item" (click)="seleccionarOpcion('estudiantes', $event)">
                                    <img src="assets/images/estudiantes.png" alt="Gestión" />
                                    <span>Gestión</span>
                                </div>
                            </div>
                            <div class="col-6" *ngIf="permisosService.tienePermiso('estudiantes.administrar')">
                                <div class="submenu-item" (click)="seleccionarOpcion('registro-rapido-estudiante', $event)">
                                    <img src="assets/images/registro-rapido-estudiante.png" alt="Registro rápido" />
                                    <span>Registro rápido</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
