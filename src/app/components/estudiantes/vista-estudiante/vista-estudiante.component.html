<div class="modulo vista-360">
  <app-header
    [tituloModulo]="'Vista 360° del Estudiante: ' + nombreCompleto"
    [mostrarCrear]="false"
    [accion]="'consultar'"
    [raiz]="'/estudiantes'"
    [regresar]="'/estudiantes/opciones/' + idEstudiante"
    [iconoTitulo]="'/assets/images/estudiantes.png'"
  ></app-header>

  <!-- Indicador de carga -->
  <div *ngIf="cargando" class="loading-container">
    <div class="spinner-wrapper">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="loading-text">Cargando información del estudiante...</p>
    </div>
  </div>

  <!-- Sin permisos sobre ninguna pestaña -->
  <div class="container-fluid mt-4" *ngIf="!cargando && sinPestanasVisibles">
    <div class="alert alert-warning text-center mb-0">
      <i class="fas fa-lock me-2"></i>
      No tienes permisos para consultar la información de este estudiante.
    </div>
  </div>

  <!-- Sistema de pestañas -->
  <div class="container-fluid mt-4" *ngIf="!cargando && !sinPestanasVisibles">
    <!-- Navegación desktop -->
    <ul class="nav nav-tabs" id="vistaEstudianteTab" role="tablist">
      <li class="nav-item" role="presentation" *ngFor="let pestana of pestanasVisibles; trackBy: trackByPestana">
        <button class="nav-link" [class.active]="pestanaActiva === pestana.id" type="button" (click)="cambiarPestana(pestana.id)">
          <i class="{{ pestana.icono }} me-2"></i>{{ pestana.nombre }}
        </button>
      </li>
    </ul>

    <!-- Navegación móvil tipo grid -->
    <div class="mobile-nav-grid">
      <div class="nav-card" *ngFor="let pestana of pestanasVisibles; trackBy: trackByPestana"
        [class.active]="pestanaActiva === pestana.id" (click)="cambiarPestana(pestana.id)">
        <div class="nav-icon"><i class="{{ pestana.icono }}"></i></div>
        <div class="nav-label">{{ pestana.nombreCorto }}</div>
      </div>
    </div>

    <!-- Contenido de las pestañas (lazy load + keep alive) -->
    <div class="tab-content border border-top-0 rounded-bottom shadow" id="vistaEstudianteTabContent">
      <!-- Datos Personales y Acudientes -->
      <div class="p-4" *ngIf="puedeVer('datos') && tabsCargados.has('datos')" [hidden]="pestanaActiva !== 'datos'">
        <app-estudiante-datos [idEstudiante]="idEstudiante"></app-estudiante-datos>
      </div>

      <!-- Datos Médicos -->
      <div class="p-4" *ngIf="puedeVer('datos-medicos') && tabsCargados.has('datos-medicos')" [hidden]="pestanaActiva !== 'datos-medicos'">
        <app-estudiante-datos-medicos [idEstudiante]="idEstudiante"></app-estudiante-datos-medicos>
      </div>

      <!-- Datos Adicionales -->
      <div class="p-4" *ngIf="puedeVer('datos-adicionales') && tabsCargados.has('datos-adicionales')" [hidden]="pestanaActiva !== 'datos-adicionales'">
        <app-estudiante-datos-adicionales [idEstudiante]="idEstudiante"></app-estudiante-datos-adicionales>
      </div>

      <!-- Medidas -->
      <div class="p-4" *ngIf="puedeVer('medidas') && tabsCargados.has('medidas')" [hidden]="pestanaActiva !== 'medidas'">
        <app-estudiante-medidas [idEstudiante]="idEstudiante"></app-estudiante-medidas>
      </div>

      <!-- Estado de Cuenta -->
      <div class="p-4" *ngIf="puedeVer('cuenta') && tabsCargados.has('cuenta')" [hidden]="pestanaActiva !== 'cuenta'">
        <app-estudiante-cuentas [idEstudiante]="idEstudiante"></app-estudiante-cuentas>
      </div>

      <div class="p-4" *ngIf="puedeVer('exenciones-mora') && tabsCargados.has('exenciones-mora')" [hidden]="pestanaActiva !== 'exenciones-mora'">
        <app-estudiante-mora-exenciones [idEstudiante]="idEstudiante"></app-estudiante-mora-exenciones>
      </div>

      <!-- Observaciones -->
      <div class="p-4" *ngIf="puedeVer('observaciones') && tabsCargados.has('observaciones')" [hidden]="pestanaActiva !== 'observaciones'">
        <app-estudiante-observaciones [idEstudiante]="idEstudiante"></app-estudiante-observaciones>
      </div>

      <!-- Asistencia -->
      <div class="p-4" *ngIf="puedeVer('asistencia') && tabsCargados.has('asistencia')" [hidden]="pestanaActiva !== 'asistencia'">
        <app-estudiante-asistencia [idEstudiante]="idEstudiante"></app-estudiante-asistencia>
      </div>

      <!-- Evaluaciones -->
      <div class="p-4" *ngIf="puedeVer('evaluaciones') && tabsCargados.has('evaluaciones')" [hidden]="pestanaActiva !== 'evaluaciones'">
        <app-estudiante-evaluaciones [idEstudiante]="idEstudiante"></app-estudiante-evaluaciones>
      </div>

      <!-- EAD-3 -->
      <div class="p-4" *ngIf="puedeVer('ead3') && tabsCargados.has('ead3')" [hidden]="pestanaActiva !== 'ead3'">
        <app-estudiante-ead3 [idEstudiante]="idEstudiante"></app-estudiante-ead3>
      </div>

      <!-- Perfil de Desarrollo -->
      <div class="p-4" *ngIf="puedeVer('perfil-desarrollo') && tabsCargados.has('perfil-desarrollo')" [hidden]="pestanaActiva !== 'perfil-desarrollo'">
        <app-estudiante-perfil-desarrollo [idEstudiante]="idEstudiante"></app-estudiante-perfil-desarrollo>
      </div>

      <!-- Documentos -->
      <div class="p-4" *ngIf="puedeVer('documentos') && tabsCargados.has('documentos')" [hidden]="pestanaActiva !== 'documentos'">
        <app-documentos-persona
          *ngIf="idPersona"
          [idPersona]="idPersona"
          [tipoPersona]="'estudiante'"
          [nombrePersona]="nombreCompleto"
          [soloLectura]="false"
          [validarAcudientes]="false"
        >
        </app-documentos-persona>
      </div>
    </div>

    <!-- Botón flotante de navegación rápida (móvil) -->
    <div class="mobile-quick-nav">
      <button class="quick-nav-btn" [class.open]="menuRapidoAbierto" (click)="toggleMenuRapido()">
        <i class="fas fa-bars"></i>
      </button>
      <div class="quick-nav-menu" [class.open]="menuRapidoAbierto">
        <div class="quick-nav-item" *ngFor="let pestana of pestanasVisibles; trackBy: trackByPestana"
          (click)="navegarRapido(pestana.id)">
          <i class="{{ pestana.icono }}"></i><span>{{ pestana.nombreCorto }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
