<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="true"
    [accion]="'ConsultarTodos'"
    [raiz]="'/estudiantes/tareas'"
    [regresar]="'/estudiantes/gestion'"
    [iconoTitulo]="'/assets/images/tareas-estudiantes.png'"
  ></app-header>

  <app-tablas
    [titulos]="titulos"
    [datos]="datos"
    [raiz]="'/estudiantes/tareas'"
    [acciones]="acciones"
    [accionEditar]="true"
    [accionEliminar]="true"
    [mostrarBuscar]="true"
    [columnasFiltro]="columnasFiltro"
    (clicAccion)="clicAccion($event)"
  ></app-tablas>
</div>
