<div class="modulo">
    <app-header
        [tituloModulo]="titulo"
        [mostrarCrear]="false"
        [accion]="accion"
        [raiz]="'/academico/pde-rangos-edad'"
        [regresar]="regresar"
        [iconoTitulo]="'/assets/images/perfil-desarrollo.png'">
    </app-header>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <label for="nombre" class="form-label">Nombre del rango <span class="text-danger">*</span></label>
                <input
                    class="form-control form-control-lg"
                    type="text"
                    id="nombre"
                    [(ngModel)]="model.nombre"
                    placeholder="Ej: 3 a 4 años"
                    required
                    [ngClass]="{'is-invalid': !model.nombre && submitted}"
                    [disabled]="!editable">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4">
                <label for="inicio" class="form-label">Desde (meses) <span class="text-danger">*</span></label>
                <input class="form-control" type="number" id="inicio" min="0"
                    [(ngModel)]="model.edad_meses_inicio" [disabled]="!editable">
            </div>
            <div class="col-md-4">
                <label for="fin" class="form-label">Hasta (meses) <span class="text-danger">*</span></label>
                <input class="form-control" type="number" id="fin" min="1"
                    [(ngModel)]="model.edad_meses_fin" [disabled]="!editable">
                <small class="form-text text-muted">El límite superior no se incluye en el rango</small>
            </div>
            <div class="col-md-4">
                <label for="orden" class="form-label">Orden <span class="text-danger">*</span></label>
                <input class="form-control" type="number" id="orden" min="1"
                    [(ngModel)]="model.orden" [disabled]="!editable">
                <small class="form-text text-muted">Define la secuencia de aplicación</small>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="activo"
                        [(ngModel)]="model.activo" [disabled]="!editable">
                    <label class="form-check-label" for="activo">Activo</label>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-sm-6" *ngIf="editable">
                <button class="btn btn-lg btn-warning w-100" (click)="guardar()">Grabar</button>
            </div>
            <div class="col-sm-6">
                <button class="btn btn-lg btn-secondary w-100" (click)="volver()">Volver</button>
            </div>
        </div>
    </div>
</div>
