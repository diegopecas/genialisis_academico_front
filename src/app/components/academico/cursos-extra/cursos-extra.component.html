<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="true"
    [accion]="'ConsultarTodos'"
    [raiz]="'/academico/cursos-extra'"
    [regresar]="'/academico'"
    [iconoTitulo]="'/assets/images/cursos-extra.png'"
  ></app-header>

  <div class="barra-sincronizar">
    <button type="button" class="btn btn-outline-warning" (click)="sincronizarPortal()" [disabled]="sincronizando">
      <i class="fas fa-globe"></i> {{ sincronizando ? 'Sincronizando...' : 'Sincronizar con el portal web' }}
    </button>
  </div>
  
  <app-tablas
    [titulos]="titulos"
    [datos]="datos"
    [raiz]="'/academico/cursos-extra'"
    [acciones]="acciones"
    [accionEditar]="true"
    [accionEliminar]="true"
    [mostrarBuscar]="true"
    [columnasFiltro]="columnasFiltro"
    (clicAccion)="clicAccion($event)"
  ></app-tablas>
</div>
