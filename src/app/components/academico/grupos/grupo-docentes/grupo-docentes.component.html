<div class="grados-section">

  <!-- El titular arriba, para que no se confunda con el área que dicta -->
  <div class="titular-linea" [class.sin-titular]="!titular">
    <i class="fas fa-star"></i>
    <span class="titular-label">Titular del grupo:</span>
    <span class="titular-nombre" *ngIf="titular">{{ titular.nombre_docente }}</span>
    <span class="titular-nombre vacio" *ngIf="!titular">sin asignar</span>
  </div>

  <div class="row">

    <!-- Columna izquierda: Docentes Disponibles -->
    <div class="col-md-6" *ngIf="editable">
      <div class="grados-card disponibles">
        <div class="card-header-subtle">
          <span class="header-icon"><i class="fas fa-list"></i></span>
          Docentes Disponibles
        </div>
        <div class="card-body-subtle">
          <div *ngIf="disponibles.length > 0">
            <div class="grados-list">
              <div class="grado-item" *ngFor="let doc of disponibles">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="'doc-' + doc.id"
                  [(ngModel)]="seleccionados[doc.id]">
                <label class="form-check-label" [for]="'doc-' + doc.id">
                  {{ doc.nombre_completo }}
                </label>
              </div>
            </div>
          </div>
          <div class="empty-state" *ngIf="disponibles.length === 0">
            <i class="fas fa-inbox"></i>
            <p>No hay docentes disponibles</p>
          </div>
        </div>
      </div>
      <button
        class="btn btn-asociar mt-3 w-100"
        (click)="asociarSeleccionados()"
        *ngIf="disponibles.length > 0">
        <i class="fas fa-arrow-right"></i> Asociar Seleccionados
      </button>
    </div>

    <!-- Columna derecha: Docentes del Grupo -->
    <div [class]="editable ? 'col-md-6' : 'col-12'">
      <div class="grados-card asociados">
        <div class="card-header-subtle">
          <span class="header-icon"><i class="fas fa-check-circle"></i></span>
          Docentes del Grupo
        </div>
        <div class="card-body-subtle">
          <div *ngIf="asignados.length > 0">
            <div class="grados-list">
              <div class="grado-item-asociado" *ngFor="let asignado of asignados">
                <span class="grado-nombre">{{ asignado.nombre_docente }}</span>

                <!-- La estrella marca el titular. Llena y dorada en quien lo
                     es; hueca y gris en los demás, para cambiarlo. -->
                <button
                  *ngIf="editable"
                  class="btn-titular"
                  [class.activo]="asignado.es_titular === 1"
                  (click)="marcarTitular(asignado)"
                  [title]="asignado.es_titular === 1 ? 'Titular del grupo' : 'Marcar como titular'">
                  <i class="fas fa-star" *ngIf="asignado.es_titular === 1"></i>
                  <i class="far fa-star" *ngIf="asignado.es_titular !== 1"></i>
                </button>

                <button
                  *ngIf="editable"
                  class="btn-desasociar"
                  (click)="quitar(asignado)"
                  title="Quitar del grupo">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="empty-state" *ngIf="asignados.length === 0">
            <i class="fas fa-inbox"></i>
            <p>Sin docentes asignados</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
