<div class="modulo">
    <app-header [tituloModulo]="titulo" [mostrarCrear]="false" [raiz]="'/'" [regresar]="'/menu'"></app-header>

    <div class="container-fluid mt-5">
        <!-- Título descriptivo -->
        <div class="text-center mb-5">
            <h2 class="titulo-seccion">¿Qué deseas administrar hoy?</h2>
            <p class="subtitulo-seccion">Selecciona una opción para comenzar</p>
        </div>

        <div class="row justify-content-center mb-4">
            <div class="col-lg-6 col-md-8">
                <app-buscar (buscar)="buscar($event)"></app-buscar>
            </div>
        </div>

        <!-- Las cinco tarjetas van en la misma grilla. Las de enlace también usan
             card-maestro: así comparten tamaño y estilo con las de submenú y no se
             estiran cuando alguna se despliega. -->
        <div class="row justify-content-center">

            <!-- Tarjetas que llevan a otra pantalla con sus propias tarjetas -->
            <div class="col-lg-4 col-md-6 mb-4" *ngFor="let tarjeta of tarjetasVisibles; trackBy: trackByTarjeta">
                <div class="card-maestro menu-principal" (click)="seleccionarOpcion(tarjeta.id)">
                    <div class="card-maestro-content">
                        <div class="icono-container" [ngClass]="tarjeta.claseIcono">
                            <img *ngIf="tarjeta.imagen" [src]="tarjeta.imagen" [alt]="tarjeta.titulo" />
                        </div>
                        <h3 class="card-titulo" [innerHTML]="tarjeta.tituloHtml || tarjeta.titulo"></h3>
                        <p class="card-descripcion">{{ tarjeta.descripcion }}</p>
                        <div class="card-footer-custom">
                            <span class="link-accion">{{ tarjeta.textoAccion }} <i class="fas fa-arrow-right"></i></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tarjetas con submenú -->
            <div class="col-lg-4 col-md-6 mb-4" *ngFor="let grupo of gruposVisibles; trackBy: trackByGrupo">
                <div class="card-maestro menu-principal" [class.active]="menuActivo === grupo.id || enBusqueda"
                    [ngStyle]="grupo.estilo || {}" (click)="toggleMenu(grupo.id, $event)">
                    <div class="card-maestro-content">
                        <div class="icono-container" [ngClass]="grupo.claseIcono">
                            <img *ngIf="grupo.imagen" [src]="grupo.imagen" [alt]="grupo.alt || grupo.titulo" />
                            <i *ngIf="!grupo.imagen && grupo.icono" [ngClass]="grupo.icono"></i>
                        </div>
                        <h3 class="card-titulo" [innerHTML]="grupo.tituloHtml || grupo.titulo"></h3>
                        <p class="card-descripcion">{{ grupo.descripcion }}</p>
                        <div class="card-footer-custom">
                            <span class="link-accion">Ver opciones <i class="fas fa-chevron-down"></i></span>
                        </div>
                    </div>

                    <div class="submenu-container">
                        <div class="row g-2">
                            <div [ngClass]="opcion.columna || 'col-6'"
                                *ngFor="let opcion of grupo.opciones; trackBy: trackByOpcion">
                                <div class="submenu-item" (click)="seleccionarOpcion(opcion.id)">
                                    <img *ngIf="opcion.imagen" [src]="opcion.imagen"
                                        [alt]="opcion.alt || opcion.label" />
                                    <i *ngIf="!opcion.imagen && opcion.icono" [ngClass]="opcion.icono"
                                        [ngStyle]="opcion.iconoEstilo || {}"></i>
                                    <span [innerHTML]="opcion.labelHtml || opcion.label"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="text-center" *ngIf="sinResultados">
            <p class="text-muted">No hay opciones que coincidan con la búsqueda.</p>
        </div>

    </div>
</div>
