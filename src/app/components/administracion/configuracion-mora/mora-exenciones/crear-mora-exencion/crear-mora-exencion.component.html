<div class="modulo">
  <app-header [tituloModulo]="titulo" [mostrarCrear]="false" [accion]="accion"
    [raiz]="'/administracion/financiero/mora-exenciones'"
    [regresar]="regresar" [iconoTitulo]="'/assets/images/productos.png'"></app-header>

  <div class="container mt-5" [ngClass]="{ 'disabled-container': !editable }">
    <div class="row">
      <div class="col-sm-12 col-md-6">
        <label class="form-label">Persona <span class="text-danger">*</span></label>
        <select class="form-select form-select-lg" [(ngModel)]="model.id_persona"
          [ngClass]="{'is-invalid': !model.id_persona && submitted}" [disabled]="!editable">
          <option value="">Seleccionar</option>
          <ng-container *ngFor="let p of listas.personas">
            <option [value]="p.id">{{ p.nombre_completo }} - {{ p.numero_identificacion }}</option>
          </ng-container>
        </select>
      </div>
      <div class="col-sm-12 col-md-6">
        <label class="form-label">Producto <small class="text-muted">(vacío = todos)</small></label>
        <select class="form-select form-select-lg" [(ngModel)]="model.id_producto_servicio" [disabled]="!editable">
          <option [ngValue]="null">Todos los productos</option>
          <ng-container *ngFor="let ps of listas.productosServicios">
            <option [value]="ps.id">{{ ps.nombre }}</option>
          </ng-container>
        </select>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-sm-12 col-md-4">
        <label class="form-label">Desde <span class="text-danger">*</span></label>
        <input type="date" class="form-control form-control-lg" [(ngModel)]="model.fecha_desde"
          [ngClass]="{'is-invalid': !model.fecha_desde && submitted}" [disabled]="!editable">
      </div>
      <div class="col-sm-12 col-md-4">
        <label class="form-label">Hasta <small class="text-muted">(vacío = indefinida)</small></label>
        <input type="date" class="form-control form-control-lg" [(ngModel)]="model.fecha_hasta" [disabled]="!editable">
      </div>
      <div class="col-sm-12 col-md-4">
        <label class="form-label">Estado</label>
        <select class="form-select form-select-lg" [(ngModel)]="model.activo" [disabled]="!editable">
          <option [ngValue]="1">Activa</option>
          <option [ngValue]="0">Inactiva</option>
        </select>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        <label class="form-label">Motivo</label>
        <textarea class="form-control form-control-lg" rows="3" [(ngModel)]="model.motivo" [disabled]="!editable"
          placeholder="Ej: Acuerdo de pago autorizado por dirección"></textarea>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-12">
        <div class="alert alert-info mb-0">
          Al exonerar, la mora causada dentro del rango desaparece en el siguiente cálculo.
          Lo único que se conserva es la mora que el acudiente <b>ya haya pagado</b>.
        </div>
      </div>
    </div>
  </div>

  <div class="container mt-5">
    <div class="row">
      <div class="col-sm-6" *ngIf="editable">
        <button class="btn btn-lg btn-warning w-100" (click)="grabar()">Grabar</button>
      </div>
      <div class="col-sm-6">
        <button class="btn btn-lg btn-secondary w-100" (click)="volver()">Volver</button>
      </div>
    </div>
  </div>
</div>
