<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [raiz]="'/'"
    [regresar]="'/administracion'"
  ></app-header>

  <div class="container-fluid mt-5">

    <div class="row justify-content-center mb-4">
      <div class="col-lg-6 col-md-8">
        <app-buscar (buscar)="buscar($event)"></app-buscar>
      </div>
    </div>

    <!-- Tarjetas de opciones con submenús -->
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6 mb-4" *ngFor="let grupo of gruposVisibles; trackBy: trackByGrupo">
        <div class="card-maestro menu-principal" [ngStyle]="grupo.estilo || {}"
          [class.active]="menuActivo === grupo.id || enBusqueda">
          <div class="card-maestro-content">
            <div class="icono-container" [ngClass]="grupo.claseIcono">
              <img *ngIf="grupo.imagen" [src]="grupo.imagen" [alt]="grupo.alt || grupo.titulo" />
              <i *ngIf="!grupo.imagen && grupo.icono" [ngClass]="grupo.icono"></i>
            </div>
            <h3 class="card-titulo" [innerHTML]="grupo.tituloHtml || grupo.titulo"></h3>
            <p class="card-descripcion">{{ grupo.descripcion }}</p>
            <div class="card-footer-custom">
              <!-- En este módulo el despliegue se hace desde el enlace, no desde toda la tarjeta -->
              <span class="link-accion" (click)="toggleMenu(grupo.id, $event)"
                >Ver opciones <i class="fas fa-chevron-down"></i
              ></span>
            </div>
          </div>

          <div class="submenu-container">
            <div class="row g-2">
              <div [ngClass]="opcion.columna || 'col-6'" *ngFor="let opcion of grupo.opciones; trackBy: trackByOpcion">
                <div class="submenu-item" (click)="seleccionarOpcion(opcion.id)">
                  <img *ngIf="opcion.imagen" [src]="opcion.imagen" [alt]="opcion.alt || opcion.label" />
                  <i *ngIf="!opcion.imagen && opcion.icono" [ngClass]="opcion.icono" [ngStyle]="opcion.iconoEstilo || {}"></i>
                  <span [innerHTML]="opcion.labelHtml || opcion.label"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center" *ngIf="enBusqueda && gruposVisibles.length === 0">
      <p class="text-muted">No hay opciones que coincidan con la búsqueda.</p>
    </div>
  </div>
</div>
