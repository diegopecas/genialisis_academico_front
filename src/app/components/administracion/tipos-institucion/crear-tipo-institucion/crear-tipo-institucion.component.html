<div class="modulo">
    <app-header [tituloModulo]="titulo" [mostrarCrear]="false" [accion]="accion"
        [raiz]="'/administracion/datos-maestros/tipos-institucion'" [regresar]="regresar"
        [iconoTitulo]="'/assets/images/tipos-institucion.png'">
    </app-header>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                <input class="form-control form-control-lg" type="text" id="nombre" [(ngModel)]="model.nombre"
                    placeholder="Ej: Colegio, Escuela, Universidad..." maxlength="50" required
                    [ngClass]="{'is-invalid': !model.nombre && submitted}" [disabled]="!editable">
                <small class="form-text text-muted">No puede repetirse dentro del jardín</small>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control form-control-lg" id="descripcion" rows="3"
                    [(ngModel)]="model.descripcion" placeholder="Para qué sirve este tipo de institución"
                    [disabled]="!editable"></textarea>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="activo" [(ngModel)]="model.activo"
                        [disabled]="!editable">
                    <label class="form-check-label" for="activo">
                        <strong>{{ model.activo ? 'Activo' : 'Inactivo' }}</strong>
                    </label>
                    <small class="d-block mt-1 text-muted">
                        Solo los tipos activos se ofrecen al registrar una institución cliente
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Botones de acción -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-sm-6" *ngIf="editable">
                <button class="btn btn-lg btn-warning w-100" (click)="guardar()">
                    Grabar
                </button>
            </div>
            <div class="col-sm-6">
                <button class="btn btn-lg btn-secondary w-100" (click)="volver()">
                    Volver
                </button>
            </div>
        </div>
    </div>
</div>
