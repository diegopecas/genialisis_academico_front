<div class="recursos-ente">

  <!-- BARRA DE FILTROS -->
  <div class="barra-filtros">
    <div class="filtro-origenes">
      <button class="chip-filtro" [class.activo]="filtroOrigen === 'TODOS'" (click)="filtroOrigen = 'TODOS'">
        Todos
      </button>
      <button class="chip-filtro" *ngFor="let o of origenes"
              [class.activo]="filtroOrigen === o" (click)="filtroOrigen = o">
        {{ o }}
      </button>
    </div>

    <div class="buscador">
      <i class="fas fa-search"></i>
      <input type="text" [(ngModel)]="busqueda" placeholder="Buscar documento o reporte..." />
    </div>
  </div>

  <!-- ACCIONES -->
  <div class="barra-acciones" *ngIf="!soloLectura">
    <div class="acciones-seleccion">
      <button class="btn-link" (click)="seleccionarVisibles(true)">
        <i class="fas fa-check-double"></i> Seleccionar visibles
      </button>
      <button class="btn-link" (click)="seleccionarVisibles(false)">
        <i class="fas fa-eraser"></i> Quitar visibles
      </button>
    </div>
    <div class="contador">
      <span class="badge-total">{{ totalSeleccionados }}</span> seleccionados
      <button class="btn-guardar" (click)="guardar()" [disabled]="guardando">
        <i class="fas fa-save"></i> {{ guardando ? 'Guardando...' : 'Guardar selección' }}
      </button>
    </div>
  </div>

  <!-- ESTADOS -->
  <div *ngIf="cargando" class="text-center text-muted py-5">Cargando...</div>
  <div *ngIf="!cargando && items.length === 0" class="text-center text-muted py-5">
    No hay documentos ni reportes disponibles para asignar.
  </div>
  <div *ngIf="!cargando && items.length > 0 && itemsFiltrados.length === 0" class="text-center text-muted py-5">
    Ningún recurso coincide con el filtro.
  </div>

  <!-- GRILLA DE TARJETAS -->
  <div class="grilla" *ngIf="!cargando">
    <div class="tarjeta"
         *ngFor="let item of itemsFiltrados"
         [class.seleccionada]="item.seleccionado"
         [class.solo-lectura]="soloLectura"
         (click)="toggle(item)">
      <div class="check">
        <i class="fas" [class.fa-check-circle]="item.seleccionado" [class.fa-circle]="!item.seleccionado"></i>
      </div>
      <div class="cuerpo">
        <span class="chip-origen" [class.reporte]="item.tipo === 'reporte'">{{ item.origen }}</span>
        <span class="titulo">{{ item.titulo }}</span>
        <small class="subtitulo" *ngIf="item.subtitulo">{{ item.subtitulo }}</small>
      </div>
    </div>
  </div>

</div>
