<div class="modulo">
    <app-header
        [tituloModulo]="titulo"
        [mostrarCrear]="false"
        [accion]="accion"
        [raiz]="'/administracion/datos-maestros/lugares-cursos-extra'"
        [regresar]="regresar"
        [iconoTitulo]="'/assets/images/lugares-cursos-extra.png'">
    </app-header>

    <div class="container mt-4">
        <div class="card card-formulario mb-4">
            <div class="card-header-custom">
                <i class="fas fa-map-marker-alt"></i>
                <span>Información del Lugar</span>
            </div>
            <div class="card-body-custom">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input
                            class="form-control"
                            type="text"
                            id="nombre"
                            [(ngModel)]="model.nombre"
                            placeholder="Ej: Piscina Municipal, Salón Múltiple..."
                            required
                            maxlength="150"
                            [ngClass]="{'is-invalid': !model.nombre && submitted}"
                            [disabled]="!editable">
                        <small class="form-text text-muted">Puede estar dentro o fuera del jardín</small>
                    </div>
                    <div class="col-md-6">
                        <label for="direccion" class="form-label">Dirección</label>
                        <input
                            class="form-control"
                            type="text"
                            id="direccion"
                            [(ngModel)]="model.direccion"
                            placeholder="Ej: Calle 10 # 5-20"
                            maxlength="300"
                            [disabled]="!editable">
                    </div>
                    <div class="col-md-6">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input
                            class="form-control"
                            type="text"
                            id="telefono"
                            [(ngModel)]="model.telefono"
                            placeholder="Ej: 3001234567"
                            maxlength="50"
                            [disabled]="!editable">
                    </div>
                    <div class="col-md-6">
                        <label for="contacto" class="form-label">Contacto</label>
                        <input
                            class="form-control"
                            type="text"
                            id="contacto"
                            [(ngModel)]="model.contacto"
                            placeholder="Nombre de la persona de contacto"
                            maxlength="150"
                            [disabled]="!editable">
                    </div>
                    <div class="col-12">
                        <label for="observaciones" class="form-label">Observaciones</label>
                        <textarea
                            class="form-control"
                            id="observaciones"
                            [(ngModel)]="model.observaciones"
                            rows="3"
                            placeholder="Indicaciones para llegar, horarios de acceso, etc."
                            [disabled]="!editable"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="card card-formulario mb-4">
            <div class="card-header-custom">
                <i class="fas fa-cogs"></i>
                <span>Configuración</span>
            </div>
            <div class="card-body-custom">
                <div class="toggle-card" [class.active]="model.activo">
                    <div class="toggle-info">
                        <div class="toggle-icon">
                            <i class="fas fa-toggle-on"></i>
                        </div>
                        <div class="toggle-text">
                            <span class="toggle-label">Activo</span>
                            <small class="toggle-description">Solo los lugares activos se ofrecen al crear un curso extracurricular</small>
                        </div>
                    </div>
                    <div class="form-check form-switch">
                        <input
                            class="form-check-input custom-switch"
                            type="checkbox"
                            id="activo"
                            [(ngModel)]="model.activo"
                            [disabled]="!editable">
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col-sm-6" *ngIf="editable">
                <button class="btn btn-lg btn-warning w-100" (click)="guardar()">
                    <i class="fas fa-save me-2"></i> Grabar
                </button>
            </div>
            <div class="col-sm-6">
                <button class="btn btn-lg btn-secondary w-100" (click)="volver()">
                    <i class="fas fa-arrow-left me-2"></i> Volver
                </button>
            </div>
        </div>
    </div>
</div>
