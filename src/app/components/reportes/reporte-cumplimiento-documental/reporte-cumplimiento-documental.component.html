<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [raiz]="'/reportes'"
    [regresar]="'/reportes'"
    [iconoTitulo]="'/assets/images/reporte-cumplimiento-documental.png'"
  ></app-header>

  <div class="container-fluid px-4 mt-3 barra-superior">
    <button class="btn btn-sm btn-outline-secondary" (click)="consultar()" [disabled]="cargando">
      <i class="fas fa-rotate me-2"></i>
      {{ cargando ? 'Cargando...' : 'Actualizar' }}
    </button>
  </div>

  <app-tablas
    [titulos]="titulos"
    [datos]="datos"
    [raiz]="'/reportes/cumplimiento-documental'"
    [acciones]="acciones"
    [columnasFiltro]="columnasFiltro"
    [mostrarBuscar]="true"
    (clicAccion)="clicAccion($event)"
    (datosFiltradosCambiados)="actualizarResumen($event)"
  ></app-tablas>

  <!-- Resumen: sigue lo que muestra la tabla, no el total cargado -->
  <div class="container-fluid px-4 resumen-pie" *ngIf="!cargando">
    <span class="resumen-item">
      <strong>{{ totalExigidos }}</strong> exigido{{ totalExigidos === 1 ? '' : 's' }}
    </span>
    <span class="resumen-item">
      <strong>{{ totalPersonas }}</strong> persona{{ totalPersonas === 1 ? '' : 's' }}
    </span>
    <span class="resumen-item peligro" *ngIf="totalSinSubir > 0">
      <strong>{{ totalSinSubir }}</strong> obligatorios sin subir
    </span>
    <span class="resumen-item alerta" *ngIf="totalVencidos > 0">
      <strong>{{ totalVencidos }}</strong> vencido{{ totalVencidos === 1 ? '' : 's' }}
    </span>
  </div>

  <div class="export-container">
    <button
      class="btn btn-success"
      (click)="exportarExcel()"
      [disabled]="exportando || cargando || datos.length === 0"
    >
      <i class="fas fa-file-excel"></i>
      {{ exportando ? "Exportando..." : "Exportar a Excel" }}
    </button>
  </div>
</div>
