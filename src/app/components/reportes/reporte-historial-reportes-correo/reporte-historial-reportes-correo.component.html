<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [raiz]="'/reportes'"
    [regresar]="'/reportes'"
    [iconoTitulo]="'/assets/images/historial-reportes-correo.png'"
  ></app-header>

  <!-- Rango de fechas: se consulta al backend. El resto de filtros los hace la tabla. -->
  <div class="container-fluid px-4 mt-3">
    <div class="row g-2 align-items-end filtros">
      <div class="col-12 col-sm-6 col-md-3">
        <label for="fechaInicio" class="form-label"><i class="fas fa-calendar"></i> Enviados desde</label>
        <app-fecha-input inputId="fechaInicio" [(ngModel)]="fechaInicio"></app-fecha-input>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <label for="fechaFin" class="form-label"><i class="fas fa-calendar"></i> Hasta</label>
        <app-fecha-input inputId="fechaFin" [(ngModel)]="fechaFin"></app-fecha-input>
      </div>
      <div class="col-12 col-md-auto">
        <button class="btn btn-warning w-100" (click)="consultar()" [disabled]="cargando">
          <i class="fas fa-search me-2"></i>
          {{ cargando ? 'Consultando...' : 'Consultar' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Resumen: sigue lo que muestra la tabla -->
  <div class="container-fluid px-4 resumen-pie" *ngIf="!cargando">
    <span class="resumen-item">
      <strong>{{ totalEnvios }}</strong> envío{{ totalEnvios === 1 ? '' : 's' }}
    </span>
    <span class="resumen-item exito">
      <strong>{{ totalEnviados }}</strong> enviado{{ totalEnviados === 1 ? '' : 's' }}
    </span>
    <span class="resumen-item peligro" *ngIf="totalFallidos > 0">
      <strong>{{ totalFallidos }}</strong> fallido{{ totalFallidos === 1 ? '' : 's' }}
    </span>
  </div>

  <app-tablas
    *ngIf="!cargando"
    [titulos]="titulos"
    [datos]="datos"
    [raiz]="'/reportes/historial-reportes-correo'"
    [columnasFiltro]="columnasFiltro"
    [mostrarBuscar]="true"
    (datosFiltradosCambiados)="actualizarResumen($event)"
  ></app-tablas>

  <div *ngIf="cargando" class="loading-container">
    <div class="spinner-border text-warning" role="status"></div>
    <p>Cargando envíos...</p>
  </div>
</div>
