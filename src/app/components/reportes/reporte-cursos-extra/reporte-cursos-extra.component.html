<div class="modulo">
    <app-header [tituloModulo]="titulo" [mostrarCrear]="false" [raiz]="'/reportes'" [regresar]="'/reportes'"
        [iconoTitulo]="'/assets/images/cursos-extra.png'"></app-header>

    <div class="container-fluid mt-4 px-4">
        <!-- Una pestana por curso con inscritos activos; Todos de primera.
             En el celular se deslizan de lado. -->
        <div class="pestanas-cursos" *ngIf="pestanas.length > 1">
            <button type="button" *ngFor="let p of pestanas" class="pestana"
                    [class.activa]="pestanaActiva === p.clave" (click)="seleccionarPestana(p.clave)">
                {{ p.texto }} <span class="cuenta">{{ p.cantidad }}</span>
            </button>
        </div>
        <div class="curso-info mb-3" *ngIf="pestanaActual && pestanaActual.clave !== 'todos' && pestanaActual.cupo">
            <span class="info-item"><i class="fas fa-users me-1"></i> Cupo: {{ contarActivos() }} / {{ pestanaActual.cupo }}</span>
        </div>
    </div>

    <!-- Exportación propia del reporte, en el mismo sitio y con el mismo
         estilo que el botón genérico de la tabla, que queda apagado. Este
         nombra el archivo con el curso y la fecha, y manda los valores como
         número para poder sumarlos en Excel. -->
    <div class="container-fluid px-4 mt-3" *ngIf="datos.length > 0">
        <div class="d-flex justify-content-end w-100">
            <button class="btn-exportar-excel" (click)="exportarExcel()"
                [disabled]="exportando || cargando || datosVisibles.length === 0">
                <i class="fas fa-file-excel me-1"></i>
                {{ exportando ? 'Exportando...' : 'Exportar Excel' }}
            </button>
        </div>
    </div>

    <app-tablas *ngIf="datos.length > 0"
        [titulos]="titulos"
        [datos]="datos"
        [raiz]="'/reportes/cursos-extra'"
        [columnasFiltro]="columnasFiltro"
        [acciones]="acciones"
        (clicAccion)="clicAccion($event)"
        [exportarExcel]="false"
        [mostrarBuscar]="true">
    </app-tablas>

    <!-- Totales de lo que dejan ver los filtros, no de todo el curso: si se
         filtra por un grupo o por un rango de fechas, el pie tiene que cuadrar
         con lo que esta en pantalla. -->
    <div class="container-fluid px-4 mt-3" *ngIf="datos.length > 0">
        <div class="totales-pie">
            <span class="total-item">
                <span class="total-rotulo">Cobrado</span>
                <span class="total-valor">$ {{ totalCobrado | number:'1.0-0' }}</span>
            </span>
            <span class="total-item">
                <span class="total-rotulo">Pagado</span>
                <span class="total-valor">$ {{ totalPagado | number:'1.0-0' }}</span>
            </span>
            <span class="total-item">
                <span class="total-rotulo">Saldo</span>
                <span class="total-valor" [class.saldo-pendiente]="totalSaldo > 0">$ {{ totalSaldo | number:'1.0-0' }}</span>
            </span>
        </div>
    </div>

    <div class="text-center text-muted py-5" *ngIf="cargando">
        <div class="spinner-border" role="status"></div>
        <p class="mt-2">Cargando los inscritos...</p>
    </div>

    <div class="text-center text-muted py-4" *ngIf="datos.length === 0 && !cargando">
        <i class="fas fa-user-graduate fa-2x mb-2"></i>
        <p>No hay estudiantes inscritos activos en ningún curso</p>
    </div>
</div>
