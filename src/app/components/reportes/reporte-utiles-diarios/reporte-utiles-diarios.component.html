<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [raiz]="'/reportes/utiles-diarios'"
    [regresar]="'/reportes'"
    [iconoTitulo]="'/assets/images/estudiantes.png'"
  ></app-header>

  <div class="container-fluid mt-4">
    <div class="row g-3 align-items-end">
      <div class="col-sm-12 col-md-3">
        <label for="grupo" class="form-label">Grupo</label>
        <select class="form-select form-select-lg" id="grupo" [(ngModel)]="filtros.id_grupo" (change)="cambiarGrupo()">
          <option [ngValue]="null">Todos los grupos</option>
          <option *ngFor="let grupo of grupos" [ngValue]="grupo.id">{{ grupo.nombre }}</option>
        </select>
      </div>
      <div class="col-sm-12 col-md-3">
        <label for="estudiante" class="form-label">Estudiante</label>
        <select class="form-select form-select-lg" id="estudiante" [(ngModel)]="filtros.id_estudiante" [disabled]="!filtros.id_grupo">
          <option [ngValue]="null">Todos los del grupo</option>
          <option *ngFor="let estudiante of estudiantes" [ngValue]="estudiante.id">
            {{ estudiante.primer_nombre }} {{ estudiante.primer_apellido }}
          </option>
        </select>
      </div>
      <div class="col-sm-6 col-md-2">
        <label for="fechaInicial" class="form-label">Desde</label>
        <input class="form-control form-control-lg" type="date" id="fechaInicial" [(ngModel)]="filtros.fecha_inicial">
      </div>
      <div class="col-sm-6 col-md-2">
        <label for="fechaFinal" class="form-label">Hasta</label>
        <input class="form-control form-control-lg" type="date" id="fechaFinal" [(ngModel)]="filtros.fecha_final">
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-sm-6">
        <button class="btn btn-lg btn-warning w-100" (click)="consultar()">Consultar</button>
      </div>
      <div class="col-sm-6">
        <button class="btn btn-lg btn-secondary w-100" (click)="limpiar()">Limpiar</button>
      </div>
    </div>
  </div>

  <div class="container-fluid mt-4" *ngIf="consultado && datos.length === 0">
    <p class="text-center">No hay registros con esos filtros.</p>
  </div>

  <div class="mt-4" *ngIf="datos.length > 0">
    <app-tablas
      [titulos]="titulos"
      [datos]="datos"
      [raiz]="'/reportes/utiles-diarios'"
      [acciones]="acciones"
      [accionEditar]="false"
      [accionEliminar]="false"
      [mostrarBuscar]="true"
      [columnasFiltro]="columnasFiltro"
    ></app-tablas>
  </div>
</div>
