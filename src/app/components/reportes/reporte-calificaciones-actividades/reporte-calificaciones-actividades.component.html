<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [raiz]="'/reportes'"
    [regresar]="'/reportes'"
    [iconoTitulo]="'/assets/images/reporte-calificaciones-actividades.png'"
  ></app-header>

  <!-- Corte y grupo se consultan al backend. El resto de filtros los hace la tabla. -->
  <div class="container-fluid px-4 mt-3">
    <div class="row g-2 align-items-end filtros">
      <div class="col-12 col-sm-6 col-md-4">
        <label for="corte" class="form-label"><i class="fas fa-calendar-alt"></i> Corte académico</label>
        <select id="corte" class="form-select" [(ngModel)]="idCorteSeleccionado">
          <option value="">Selecciona un corte</option>
          <option *ngFor="let corte of cortes" [value]="corte.id">{{ corte.nombre }}</option>
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-4">
        <label for="grupo" class="form-label"><i class="fas fa-users"></i> Grupo</label>
        <select id="grupo" class="form-select" [(ngModel)]="idGrupoSeleccionado">
          <option value="">Selecciona un grupo</option>
          <option *ngFor="let grupo of grupos" [value]="grupo.id">{{ grupo.nombre }}</option>
        </select>
      </div>
      <div class="col-12 col-md-auto">
        <button class="btn btn-warning w-100" (click)="consultar()" [disabled]="cargando">
          <i class="fas fa-search me-2"></i>
          {{ cargando ? 'Consultando...' : 'Consultar' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Resumen: sigue lo que muestra la tabla, no el total cargado -->
  <div class="container-fluid px-4 resumen-pie" *ngIf="consultado && !cargando">
    <span class="resumen-item">
      <strong>{{ totalEstudiantes }}</strong> estudiante{{ totalEstudiantes === 1 ? '' : 's' }}
    </span>
    <span class="resumen-item">
      <strong>{{ totalActividades }}</strong> actividad{{ totalActividades === 1 ? '' : 'es' }}
    </span>
  </div>

  <app-tablas
    *ngIf="consultado && !cargando"
    [titulos]="titulos"
    [datos]="datos"
    [raiz]="'/reportes/calificaciones-actividades'"
    [columnasFiltro]="columnasFiltro"
    [mostrarBuscar]="true"
    (datosFiltradosCambiados)="actualizarResumen($event)"
  ></app-tablas>

  <div *ngIf="!consultado && !cargando" class="mensaje-inicial">
    <i class="fas fa-clipboard-list"></i>
    <p>Selecciona el corte académico y el grupo, y da clic en Consultar.</p>
  </div>

  <div *ngIf="cargando" class="loading-container">
    <div class="spinner-border text-warning" role="status"></div>
    <p>Cargando calificaciones...</p>
  </div>
</div>
