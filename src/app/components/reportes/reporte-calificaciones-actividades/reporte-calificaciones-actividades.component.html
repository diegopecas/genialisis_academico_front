<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [raiz]="'/reportes'"
    [regresar]="'/reportes'"
    [iconoTitulo]="'/assets/images/reporte-calificaciones-actividades.png'"
  ></app-header>

  <!-- Rango de fechas: se consulta al backend. El resto de filtros los hace la tabla. -->
  <div class="container-fluid px-4 mt-3">
    <div class="row g-2 align-items-end filtros">
      <div class="col-12 col-sm-6 col-md-3">
        <label for="fechaInicio" class="form-label"><i class="fas fa-calendar"></i> Fecha inicial</label>
        <input type="date" id="fechaInicio" class="form-control" [(ngModel)]="fechaInicio" [max]="fechaFin">
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <label for="fechaFin" class="form-label"><i class="fas fa-calendar"></i> Fecha final</label>
        <input type="date" id="fechaFin" class="form-control" [(ngModel)]="fechaFin" [min]="fechaInicio">
      </div>
      <div class="col-12 col-md-auto">
        <button class="btn btn-warning w-100" (click)="consultar()" [disabled]="cargando">
          <i class="fas fa-search me-2"></i>
          {{ cargando ? 'Consultando...' : 'Consultar' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Resumen: sigue lo que muestra la tabla, no el total cargado -->
  <div class="container-fluid px-4 resumen-pie" *ngIf="!cargando">
    <span class="resumen-item">
      <strong>{{ totalEstudiantes }}</strong> estudiante{{ totalEstudiantes === 1 ? '' : 's' }}
    </span>
    <span class="resumen-item">
      <strong>{{ totalActividades }}</strong> actividad{{ totalActividades === 1 ? '' : 'es' }}
    </span>
  </div>

  <app-tablas
    *ngIf="!cargando"
    [titulos]="titulos"
    [datos]="datos"
    [raiz]="'/reportes/calificaciones-actividades'"
    [columnasFiltro]="columnasFiltro"
    [mostrarBuscar]="true"
    (datosFiltradosCambiados)="actualizarResumen($event)"
  ></app-tablas>

  <div *ngIf="cargando" class="loading-container">
    <div class="spinner-border text-warning" role="status"></div>
    <p>Cargando calificaciones del {{ fechaInicio }} al {{ fechaFin }}...</p>
  </div>
</div>
