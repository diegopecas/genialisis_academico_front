<div class="modulo">
  <app-header
    [tituloModulo]="titulo"
    [mostrarCrear]="false"
    [raiz]="'/operaciones/inventario-diario'"
    [regresar]="'/operaciones'"
    [iconoTitulo]="'/assets/images/actividades.png'"
  ></app-header>

  <div class="container-fluid mt-4">
    <div class="row g-3 align-items-end">
      <div class="col-sm-12 col-md-4">
        <label for="grupo" class="form-label">Grupo</label>
        <select class="form-select form-select-lg" id="grupo" [(ngModel)]="idGrupo" (change)="cambiarGrupo()">
          <option [ngValue]="null">Selecciona un grupo</option>
          <option *ngFor="let grupo of grupos" [ngValue]="grupo.id">{{ grupo.nombre }}</option>
        </select>
      </div>
      <div class="col-sm-12 col-md-3">
        <label for="fecha" class="form-label">Fecha</label>
        <input class="form-control form-control-lg" type="date" id="fecha" [(ngModel)]="fecha" (change)="consultarDia()">
      </div>
      <div class="col-sm-12 col-md-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="soloPresentes" [(ngModel)]="soloPresentes" (change)="consultarDia()">
          <label class="form-check-label" for="soloPresentes">Solo los que están presentes</label>
        </div>
      </div>
      <div class="col-sm-12 col-md-2 text-end">
        <div class="btn-group w-100" role="group">
          <button type="button" class="btn btn-lg"
            [ngClass]="modo === 'entrada' ? 'btn-warning' : 'btn-outline-secondary'"
            (click)="cambiarModo('entrada')">Entrada</button>
          <button type="button" class="btn btn-lg"
            [ngClass]="modo === 'salida' ? 'btn-warning' : 'btn-outline-secondary'"
            (click)="cambiarModo('salida')">Salida</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid mt-4" *ngIf="cargando">
    <p class="text-center">Cargando...</p>
  </div>

  <div class="container-fluid mt-4" *ngIf="!cargando && idGrupo && estudiantes.length === 0">
    <p class="text-center">No hay estudiantes para mostrar con estos filtros.</p>
  </div>

  <div class="container-fluid mt-4" *ngIf="!cargando && estudiantes.length > 0">
    <div class="table-responsive">
      <table class="table table-bordered align-middle tabla-inventario">
        <thead>
          <tr>
            <th class="columna-estudiante">Estudiante</th>
            <th class="text-center" *ngFor="let columna of columnas">
              <i *ngIf="columna.icono" [class]="columna.icono"></i>
              {{ columna.nombre }}
            </th>
            <th class="text-center columna-accion"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let estudiante of estudiantes" [ngClass]="{'fila-faltante': tieneFaltantes(estudiante.id_estudiante)}">
            <td>
              <div>{{ nombreEstudiante(estudiante) }}</div>
              <div class="chips" *ngIf="obtenerSueltos(estudiante.id_estudiante).length > 0">
                <span class="chip" *ngFor="let suelto of obtenerSueltos(estudiante.id_estudiante)"
                  [ngClass]="{'chip-marcado': estaMarcado(suelto), 'chip-bloqueado': estaBloqueado(suelto)}">
                  <input type="checkbox"
                    [checked]="estaMarcado(suelto)"
                    [disabled]="estaBloqueado(suelto)"
                    (change)="alternar(suelto)">
                  {{ suelto.nombre }}
                  <a class="chip-quitar" (click)="quitarSuelto(suelto)" title="Quitar">&times;</a>
                </span>
              </div>
              <div class="aviso-faltante" *ngIf="tieneFaltantes(estudiante.id_estudiante)">
                Se va sin todo lo que trajo
              </div>
            </td>
            <td class="text-center" *ngFor="let columna of columnas">
              <ng-container *ngIf="obtenerFila(estudiante.id_estudiante, columna.id) as fila; else sinFila">
                <span *ngIf="estaBloqueado(fila)" class="text-muted">&mdash;</span>
                <input *ngIf="!estaBloqueado(fila)" type="checkbox"
                  class="form-check-input check-inventario"
                  [checked]="estaMarcado(fila)"
                  (change)="alternar(fila)">
              </ng-container>
              <ng-template #sinFila>
                <span class="text-muted">&mdash;</span>
              </ng-template>
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-secondary" (click)="agregarElemento(estudiante)" title="Agregar elemento">
                <i class="fas fa-plus"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="container-fluid mt-4 mb-5" *ngIf="!cargando && estudiantes.length > 0">
    <div class="row">
      <div class="col-sm-12">
        <button class="btn btn-lg btn-warning w-100" (click)="guardar()" [disabled]="guardando">
          <span *ngIf="!hayPendientes">Confirmar el día como está</span>
          <span *ngIf="hayPendientes">Grabar {{ totalPendientes }} cambio(s)</span>
        </button>
      </div>
    </div>
  </div>
</div>
