<!-- Niño y selector de vista -->
<div class="agenda-cabecera">
  <div class="cabecera-nino">
    <button
      type="button"
      class="btn-cambiar"
      *ngIf="mostrarCambiar"
      (click)="cambiarEstudiante.emit()"
      title="Cambiar de estudiante"
    >‹</button>

    <div class="nino-avatar">{{ iniciales(estudiante) }}</div>

    <div class="nino-info">
      <h3>{{ estudiante?.nombre_completo }}</h3>
      <span *ngIf="estudiante?.nombre_grupo">{{ estudiante?.nombre_grupo }}</span>
    </div>
  </div>

  <div class="selector-vista">
    <button
      type="button"
      *ngFor="let m of modos"
      class="vista-btn"
      [class.activo]="modo === m.id"
      (click)="modoCambio.emit(m.id)"
      [title]="m.nombre"
    >
      <span class="vista-icono">{{ m.icono }}</span>
      <span class="vista-nombre">{{ m.nombre }}</span>
    </button>
  </div>
</div>

<!-- Navegación por fecha -->
<div class="agenda-fecha">
  <button
    type="button"
    class="fecha-btn"
    [disabled]="!puedeRetroceder()"
    (click)="diaAnterior()"
    title="Día anterior"
  >‹</button>

  <div class="fecha-centro">
    <span class="fecha-texto">{{ texto() }}</span>
    <div class="fecha-acciones">
      <input
        type="date"
        class="fecha-input"
        [value]="fecha"
        [min]="fechaMinima"
        [max]="fechaMaxima"
        (change)="escogerFecha($any($event.target).value)"
      />
      <button type="button" class="btn-hoy" *ngIf="!esHoy()" (click)="irAHoy()">Hoy</button>
    </div>
  </div>

  <button
    type="button"
    class="fecha-btn"
    [disabled]="!puedeAvanzar()"
    (click)="diaSiguiente()"
    title="Día siguiente"
  >›</button>
</div>

<!-- Buscador del día -->
<div class="agenda-buscador" *ngIf="mostrarBuscador">
  <span class="buscador-lupa">🔍</span>
  <input
    type="text"
    class="buscador-input"
    placeholder="Buscar en el día..."
    [value]="busqueda"
    (input)="escribirBusqueda($any($event.target).value)"
  />
  <button type="button" class="buscador-limpiar" *ngIf="busqueda" (click)="limpiarBusqueda()">&times;</button>
  <span class="buscador-conteo" *ngIf="busqueda">
    {{ totalVisibles }} de {{ totalEventos }}
  </span>
</div>
